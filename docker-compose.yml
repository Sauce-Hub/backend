version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: open_sauce_backend_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - open_sauce_network

  db:
    image: postgres:16-alpine
    container_name: open_sauce_backend_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: open_sauce
      POSTGRES_USER: open_sauce_user
      POSTGRES_PASSWORD: open_sauce_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_sauce_user -d open_sauce"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - open_sauce_network

volumes:
  postgres_data:

networks:
  open_sauce_network:
    driver: bridge
